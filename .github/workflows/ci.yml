name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} · quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, json, mbstring, pdo, sockets
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Coding style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

      - name: Security audit
        run: composer audit --locked

  integration:
    name: pgvector + Redis · integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, json, mbstring, pdo, pdo_pgsql, redis, sockets
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example --profile integration config --quiet

      - name: Start deterministic services
        run: docker compose --env-file .env.example --profile integration up -d --wait

      - name: Run integration tests
        env:
          CONTEXT_ENGINE_RUN_PGVECTOR_TESTS: '1'
          CONTEXT_ENGINE_RUN_REDIS_TESTS: '1'
          CONTEXT_ENGINE_PGVECTOR_DATABASE: context_engine
          CONTEXT_ENGINE_PGVECTOR_USERNAME: context_engine
          CONTEXT_ENGINE_PGVECTOR_PASSWORD: context_engine
          CONTEXT_ENGINE_PGVECTOR_PORT: '54339'
          CONTEXT_ENGINE_REDIS_PASSWORD: context_engine
          CONTEXT_ENGINE_REDIS_PORT: '63809'
        run: vendor/bin/phpunit --testsuite integration

      - name: Show service logs after failure
        if: failure()
        run: docker compose --env-file .env.example --profile integration logs --no-color

      - name: Stop services
        if: always()
        run: docker compose --env-file .env.example --profile integration down --volumes
